<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微博 · DBlog</title>
  <meta name="description" content="DBlog —— 一个支持微博、主题切换与全文检索的静态博客">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/themes/default/style.css">
  <link rel="stylesheet" href="/assets/css/highlight.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="/">DBlog</a>
      <span class="site-subtitle">记录生活与思考</span>

      <button class="nav-toggle" aria-label="菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/posts/">文章</a>
        <a href="/weibo/">微博</a>
        <a href="/about/">关于</a>
      </nav>

      <div class="header-tools">
        <div class="search">
          <input type="search" id="search-input" placeholder="搜索文章 / 微博…" aria-label="搜索" autocomplete="off">
          <div class="search-results" id="search-results" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

  <h1 class="page-title">微博</h1>
  <p class="page-desc">共 1 条微博</p>

  <section class="weibo-year">
    <h2 class="weibo-year-title">2026 年</h2>
    <h3 class="weibo-month-title">8 月</h3>
    <div class="weibo-list">
      <article class="weibo-item" id="2026-08-24">
        <header class="weibo-meta">
          <time>2026-08-24</time>
          <a class="weibo-link" href="#2026-08-24">#</a>
        </header>
        <div class="weibo-content"><p>博客上线啦！以后就在这里记录生活与思考。</p>
</div>
      </article>
    </div>
  </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 JyunJung · Powered by <a href="https://github.com/HyperText1994/DBlog" target="_blank" rel="noopener noreferrer">DBlog</a></p>

    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/search.js" defer></script>
</body>
</html>
